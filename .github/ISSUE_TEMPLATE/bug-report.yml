name: Bug Report
description: File a bug report.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: checkboxes
    id: faq
    attributes:
      label: FAQ
      description: Please check the [FAQ](https://davidcristian.github.io/Kalandra/faq) before submitting an issue
      options:
        - label: I have checked the [FAQ](https://davidcristian.github.io/Kalandra/faq) and my problem was not there
          required: true
  - type: checkboxes
    id: common-issues
    attributes:
      label: Common Issues
      description: Please check the [Common Issues Page](https://davidcristian.github.io/Kalandra/issues) before submitting an issue
      options:
        - label: I have checked the [Common Issues Page](https://davidcristian.github.io/Kalandra/issues) and my problem was not there
          required: true
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing Issues
      description: Please check the [existing issues](https://github.com/davidcristian/Kalandra/issues?q=is%3Aissue), including those at the top of the list, before submitting an issue
      options:
        - label: I have checked the [existing issues](https://github.com/davidcristian/Kalandra/issues?q=is%3Aissue) and my problem was not there
          required: true
  - type: dropdown
    id: common-bug
    attributes:
      label: Common Bugs
      description: Selection for bugs that are known to occur frequently with game updates
      options:
        - An error occurred while parsing the item
        - Not recognized modifier
        - No relevant stats were found
        - Other
      default: 3
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Kalandra are you running? You can see this in Settings -> About
      options:
        - 0.18.0
        - 0.17.0
        - 0.16.3
        - 0.16.2
        - 0.16.1
        - 0.16.0
        - 0.15.8
        - 0.15.7
        - 0.15.6
        - 0.15.5
        - 0.15.4
        - 0.15.3
        - 0.15.2
        - 0.15.1
        - 0.15.0
    validations:
      required: true
  - type: textarea
    id: item
    attributes:
      label: Item Copy text
      description: Copy the item's text and paste it here. To copy it, hover over the item in the game and press `Ctrl + Alt + C`. If the bug is not about an item, write "None". A report about an item that says "None" here is ignored.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Please go to Settings -> Debug, and copy and paste what is in that text box. (No need for backticks)
      render: shell
    validations:
      required: true
