server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location /prices/ {
        types { application/json json; }
        default_type application/json;
        add_header Cache-Control "public, max-age=300";

        location ~ /\. {
            return 404;
        }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
