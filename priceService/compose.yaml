name: kalandra-prices

services:
  prices:
    build:
      context: ..
      dockerfile: priceService/Dockerfile
    restart: unless-stopped
    environment:
      PRICE_CONTACT: ${PRICE_CONTACT:-}
    volumes:
      - prices:/srv/prices
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/srv/prices/index.json') > 7500)"]
      interval: 5m
      start_period: 10m

  web:
    image: nginx:1.30.6-alpine3.24
    restart: unless-stopped
    depends_on: [prices]
    volumes:
      - prices:/usr/share/nginx/html/prices:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  prices:
