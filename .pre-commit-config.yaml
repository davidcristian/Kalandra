default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        # --enforce-all also checks files already in git, such as a regenerated items.ndjson.
        args: ['--maxkb=2048', '--enforce-all']
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
-   repo: local
    hooks:
    -   id: check-version-consistency
        name: Check Version Consistency
        entry: python scripts/versioncheck.py
        language: python
        files: ^scripts/versioncheck\.py$|\.(js|md|yml|json)$

    -   id: lint-fix-main
        name: Lint Fix Main Project
        entry: npm run fix --prefix ./main
        language: system
        pass_filenames: false
        files: ^main/.*\.(ts|js|mjs|jsx|tsx)$

    -   id: lint-fix-renderer
        name: Lint Fix Renderer Project
        entry: npm run lint-fix --prefix ./renderer
        language: system
        pass_filenames: false
        files: ^renderer/.*\.(ts|js|jsx|tsx|vue)$

    -   id: format-main
        name: Format Main Project
        entry: npm run format --prefix ./main
        language: system
        pass_filenames: false
        files: ^main/.*\.(ts|js|mjs|jsx|tsx|vue|json|md)$

    -   id: format-renderer
        name: Format Renderer Project
        entry: npm run format --prefix ./renderer
        language: system
        pass_filenames: false
        files: ^renderer/.*\.(ts|js|jsx|tsx|vue|json|md)$

    -   id: type-check-main
        name: Type Check Main Project
        entry: npm run check-types --prefix ./main
        language: system
        pass_filenames: false
        files: ^main/.*\.(ts|js|jsx|tsx|vue|json|md)$

    -   id: type-check-renderer
        name: Type Check Renderer Project
        entry: npm run check-types --prefix ./renderer
        language: system
        pass_filenames: false
        files: ^renderer/.*\.(ts|js|jsx|tsx|vue|json|md)$
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
    -   id: ruff-check
        args: [--fix]
        files: ^(priceService|scripts)/
    -   id: ruff-format
        files: ^(priceService|scripts)/
-   repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
    -   id: pyright
        files: ^(priceService/|scripts/|pyrightconfig\.json$)
        pass_filenames: false
-   repo: local
    hooks:
    -   id: linecap
        name: Line limits
        entry: python scripts/linecap.py
        language: python
        pass_filenames: false
        always_run: true
    -   id: dashcheck
        name: No em dash or en dash
        entry: python scripts/dashcheck.py
        language: python
        pass_filenames: false
        always_run: true
    -   id: prosecheck
        name: Prose rules
        entry: python scripts/prosecheck.py
        language: python
        pass_filenames: false
        always_run: true
    -   id: linkcheck
        name: Links in the developer docs
        entry: python scripts/linkcheck.py
        language: python
        pass_filenames: false
        always_run: true
    -   id: backlogcheck
        name: Backlog indexes
        entry: python scripts/backlogcheck.py
        language: python
        pass_filenames: false
        always_run: true
    -   id: allowscripts
        name: allowScripts entries
        entry: python scripts/allowscripts.py
        language: python
        pass_filenames: false
        files: (^|/)package(-lock)?\.json$|^scripts/(allowscripts|repofiles)\.py$
    -   id: commitlint
        name: Commit message rules
        entry: python scripts/commitlint.py
        language: python
        stages: [commit-msg]
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, chore, revert]
